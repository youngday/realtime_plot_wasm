[package]
name = "my_ssr"
edition = "2024"
version = "0.1.2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1.53", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
log = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
leptos = "0.8"
leptos_axum = { version = "0.8", optional = true }
# NOTE: the previous git dependency (github.com/youngday/leptos-chartistry) no longer
# resolves from this machine, so we track the published crate instead.
leptos-chartistry = "0.2"
leptos_meta = "0.8"
wasm-bindgen = "0.2"
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["fs"], optional = true }
web-sys = { version = "0.3", features = ["MessageEvent", "WebSocket"] }
getrandom = { version = "0.4",optional = true }
[features]
hydrate = ["leptos/hydrate", "getrandom/wasm_js"]
ssr = [
  "dep:axum",
  "dep:leptos_axum",
  "dep:tower",
  "dep:tower-http",
  "dep:tokio",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos-chartistry/ssr",
]

[package.metadata.leptos]
bin-features = ["ssr"]
lib-features = ["hydrate"]

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.53", features = ["full"] }
rand = "0.10"
env_logger = "0.11"


[[example]]
name = "server"
path = "examples/server.rs"
